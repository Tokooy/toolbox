<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>美国国债收益率看板 · US Treasury Yields</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1424'/%3E%3Cpath d='M5 21l6-7 5 4 7-9' stroke='%2338bdf8' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23' cy='9' r='2.2' fill='%23fbbf24'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
        <polyline points="17 6 23 6 23 12" />
      </svg>
    </div>
    <div class="brand-text">
      <h1>美国国债收益率</h1>
      <p>US Treasury Yield Curves · 2Y / 10Y / 30Y</p>
    </div>
  </div>

  <div class="topbar-right">
    <div class="update-info">
      <span class="status-dot" id="statusDot"></span>
      <span id="updateText">正在加载数据…</span>
    </div>
    <button id="refreshBtn" class="refresh-btn" type="button">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
      <span>获取最新数据</span>
    </button>
  </div>
</header>

<main class="container">
  <section class="stats" id="stats" aria-label="最新收益率概览"></section>

  <section class="chart-card">
    <div class="chart-head">
      <div>
        <h2>收益率走势（2020 年至今）</h2>
        <p class="chart-tip">在图表区域滚动鼠标滚轮放大 / 缩小时间跨度 · 按住拖拽平移 · 右上角按钮还原视图</p>
      </div>
    </div>
    <div id="chart" class="chart" role="img" aria-label="美国 2/10/30 年期国债收益率曲线图"></div>
  </section>

  <footer class="footer">
    <p>
      数据来源：<a href="https://fred.stlouisfed.org/" target="_blank" rel="noopener">美国圣路易斯联邦储备银行 FRED</a>
      （美联储官方数据发布渠道，权威可信）
    </p>
    <p>
      序列：<span class="swatch" style="--c:#fbbf24"></span>DGS2（2 年期）
      · <span class="swatch" style="--c:#38bdf8"></span>DGS10（10 年期）
      · <span class="swatch" style="--c:#a78bfa"></span>DGS30（30 年期）
      —— 美国国债恒定到期收益率（日频收盘值，节假日无数据）
    </p>
  </footer>
</main>

<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
